
services:
  postgres:
    image: postgres:17
    container_name: fooddash-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: food_dash
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    image: peaceudochi/fooddash-backend:latest
    container_name: fooddash-backend
    restart: always
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: food_dash
      DB_PORT: 5432
      PORT: 8080
      JWT_SECRET: supersecretkey
      ALLOWED_HOSTS: http://localhost:5173,http://127.0.0.1:5173,http://18.133.193.66
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    image: peaceudochi/fooddash-frontend:latest
    container_name: fooddash-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres-data:
